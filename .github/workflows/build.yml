name: Build applications
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: windows-2022
            target: windows-x86_64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[build]" pytest
      - name: Test
        run: python -m pytest -q
      - name: Test interface logic
        run: node tests/test_ui.cjs
      - name: Build
        run: python -m PyInstaller --clean --noconfirm video-annotating-interface.spec
      - name: Test executable
        run: python scripts/smoke_executable.py
      - name: Package
        run: python scripts/package.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: video-annotating-interface-${{ matrix.target }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 30
