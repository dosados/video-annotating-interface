name: Build applications
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: windows-2022
            target: windows-x86_64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[build]" pytest
      - name: Test
        run: python -m pytest -q
      - name: Test interface logic
        run: node tests/test_ui.cjs
      - name: Build
        run: python -m PyInstaller --clean --noconfirm video-annotating-interface.spec
      - name: Test executable
        run: python scripts/smoke_executable.py
      - name: Package
        run: python scripts/package.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: video-annotating-interface-${{ matrix.target }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: video-annotating-interface-*
          merge-multiple: true
          path: release-files
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-files/* --clobber
          else
            gh release create "$RELEASE_TAG" release-files/* --verify-tag --draft --title "$RELEASE_TAG" --notes-file docs/release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
