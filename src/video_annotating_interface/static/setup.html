<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open video — Video Annotating Interface</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#e5e7eb;font:16px system-ui}main{max-width:800px;margin:7vh auto;padding:28px;background:#1f2937;border-radius:12px}h1{font-size:26px}p{color:#b7c2d2;line-height:1.5}label{display:block;margin-top:24px}.row{display:flex;gap:8px;margin-top:8px}input{min-width:0;flex:1;padding:12px;border:1px solid #536174;border-radius:6px;background:#111827;color:white}button{padding:11px 18px;border:0;border-radius:6px;background:#374151;color:white;cursor:pointer}button.primary{background:#2563eb;margin-top:28px}button:disabled{opacity:.5}#error,#browseError{color:#fca5a5;white-space:pre-wrap}dialog{width:min(760px,95vw);background:#1f2937;color:white;border:1px solid #536174;border-radius:10px}dialog::backdrop{background:#0009}#entries{height:45vh;overflow:auto;margin-top:16px}#entries button{display:block;width:100%;text-align:left;border-bottom:1px solid #536174;border-radius:0;background:transparent}.hint{font-size:14px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
</style>
<main><h1>Open video</h1><p>Choose local files. Existing annotation files resume your saved progress; a new output file starts a new annotation.</p>
<form id="form"><label for="video">Video</label><div class="row"><input id="video" required placeholder="Full path to video"><button type="button" data-field="video">Browse…</button></div>
<label for="suggestions">Suggestions JSON (optional)</label><div class="row"><input id="suggestions" placeholder="Leave empty to annotate without suggestions"><button type="button" data-field="suggestions">Browse…</button></div>
<label for="output">Output annotations JSON</label><div class="row"><input id="output" required placeholder="Full path to new or existing .json file"><button type="button" data-field="output">Browse…</button></div>
<p class="hint">Edits are saved automatically to the output file. Input suggestions are preserved.</p><button class="primary" id="open">Open annotation</button><p id="error" role="alert"></p></form></main>
<dialog id="chooser"><h2 id="chooserTitle">Choose file</h2><div class="row"><button id="up">↑ Up</button><input id="directory" aria-label="Directory"><button id="navigate">Go</button></div><div id="entries"></div><p id="browseError" role="alert"></p><div id="saveRow" class="row"><input id="filename" aria-label="Output file name" placeholder="annotations.json"></div><div class="actions"><button id="cancel">Cancel</button><button id="select">Select output</button></div></dialog>
<script>
const $=id=>document.getElementById(id);let defaults,field,current,parent;
async function request(url,options){const r=await fetch(url,options);const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data;}
function join(folder,name){return folder.replace(/[\\/]$/,'')+'/'+name;}
function suggestOutput(){if(!$('output').value&&$('video').value){const name=$('video').value.split(/[\\/]/).pop().replace(/\.[^.]+$/,'');$('output').value=join(defaults.output_directory,name+'.annotations.json');}}
async function browse(path){$('browseError').textContent='';try{const data=await request('/api/files?'+new URLSearchParams({path,kind:field==='video'?'video':'json'}));current=data.path;parent=data.parent;$('directory').value=current;$('entries').replaceChildren();for(const entry of data.entries){const b=document.createElement('button');b.textContent=(entry.directory?'📁 ':'')+entry.name;b.onclick=()=>{if(entry.directory)browse(entry.path);else if(field==='output')$('filename').value=entry.name;else{$(field).value=entry.path;suggestOutput();$('chooser').close();}};$('entries').append(b);}}catch(e){$('browseError').textContent=e.message;if(!current&&path!==defaults.input_directory)await browse(defaults.input_directory);}}
for(const b of document.querySelectorAll('[data-field]'))b.onclick=async()=>{field=b.dataset.field;current=null;parent=null;$('chooserTitle').textContent=field==='output'?'Choose output location':'Choose '+field;$('saveRow').hidden=field!=='output';$('select').hidden=field!=='output';const value=$(field).value;const split=value.search(/[^\\/]+$/);const directory=value&&split>=0?value.slice(0,split):defaults.input_directory;$('filename').value=field==='output'?(value.split(/[\\/]/).pop()||'annotations.json'):'';$('chooser').showModal();await browse(directory||defaults.input_directory);};
$('up').onclick=()=>browse(parent||defaults.input_directory);$('navigate').onclick=()=>browse($('directory').value);$('directory').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();browse($('directory').value);}};$('cancel').onclick=()=>$('chooser').close();$('select').onclick=()=>{const name=$('filename').value.trim();if(!name||/[\\/]/.test(name)||!name.toLowerCase().endsWith('.json')){$('browseError').textContent='Enter a file name ending in .json';return;}$('output').value=join(current,name);$('chooser').close();};$('video').onchange=suggestOutput;
$('form').onsubmit=async e=>{e.preventDefault();$('open').disabled=true;$('error').textContent='Opening…';try{await request('/api/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({video:$('video').value.trim(),suggestions:$('suggestions').value.trim()||null,output:$('output').value.trim()})});location.href='/';}catch(error){$('error').textContent=error.message;$('open').disabled=false;}};
request('/api/setup').then(data=>{defaults=data;}).catch(e=>{$('error').textContent=e.message;});
</script></html>
