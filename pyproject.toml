[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-annotating-interface"
version = "0.1.2"
description = "Local, frame-accurate video annotation for points and boxes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["opencv-python-headless>=4.9"]

[project.optional-dependencies]
build = ["pyinstaller>=6"]
dev = ["pytest>=8", "ruff>=0.6", "playwright>=1.55"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_annotating_interface = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
